# OPCIONAL: PostgreSQL en Docker con las mismas credenciales que backend/src/main/resources/application.yml.
# Si ya tienes PostgreSQL instalado en Windows con usuario postgres / clave root, no necesitas esto.
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: mercadona_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
